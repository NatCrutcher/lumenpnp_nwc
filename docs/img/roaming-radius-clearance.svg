<svg xmlns="http://www.w3.org/2000/svg" viewBox="-285 -250 570 516" font-family="system-ui, sans-serif">
  <!-- Top view of the bottom-camera area at camera Z, drawn to scale: 7 px = 1 mm. -->
  <rect x="-285" y="-250" width="570" height="516" fill="#ffffff"/>

  <!-- Build plate with 45.0 mm dia opening — 10 mm BELOW the part plane, not a constraint -->
  <path fill-rule="evenodd" fill="#ece7dd" stroke="#c9c2b2" stroke-width="1"
        d="M -285 -225 H 285 V 216 H -285 Z
           M 157.5 0 A 157.5 157.5 0 1 0 -157.5 0 A 157.5 157.5 0 1 0 157.5 0 Z"/>

  <!-- Camera field of view, 46.4 x 26.0 mm -->
  <rect x="-162.4" y="-91" width="324.8" height="182" fill="#eaf2fb" fill-opacity="0.55"
        stroke="#7aa7d9" stroke-width="1.5" stroke-dasharray="8 4"/>

  <!-- Light-ring diffuser aperture, ID 19.5 mm (below the part plane) -->
  <circle r="68.25" fill="#fdf6dd" fill-opacity="0.7" stroke="#d6c67e" stroke-width="1.5"/>

  <!-- Fiducial supports at r = 30 mm: the binding obstruction at camera Z -->
  <circle r="210" fill="none" stroke="#444444" stroke-width="3"/>
  <!-- Roaming radius + N24 pick tolerance = 29.5 mm -->
  <circle r="206.5" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <!-- Configured roaming radius, 28.5 mm -->
  <circle r="199.5" fill="none" stroke="#1a5fb4" stroke-width="3"/>

  <!-- Camera axis -->
  <line x1="-8" y1="0" x2="8" y2="0" stroke="#555" stroke-width="1"/>
  <line x1="0" y1="-8" x2="0" y2="8" stroke="#555" stroke-width="1"/>

  <!-- Radius arrow for the roaming radius -->
  <line x1="0" y1="0" x2="141.1" y2="-141.1" stroke="#1a5fb4" stroke-width="1.5"/>
  <text x="64" y="-74" fill="#1a5fb4" font-size="13" font-weight="bold" transform="rotate(-45 70 -70)" text-anchor="middle">28.5 mm</text>

  <!-- Labels -->
  <text x="0" y="-234" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">Bottom-Camera Roaming Radius — Top View at Camera Z (7 px/mm)</text>

  <text x="-278" y="-207" font-size="12" fill="#8a8271">build plate opening Ø 45.0 mm — 10 mm below the part plane, not a constraint</text>

  <text x="276" y="-190" font-size="12" font-weight="bold" fill="#444" text-anchor="end">fiducial supports at r = 30 mm (binding)</text>
  <line x1="192" y1="-185" x2="157" y2="-139" stroke="#444" stroke-width="1"/>

  <text x="-277" y="-131" font-size="12" fill="#4a7ab5">camera FOV 46.4 × 26.0 mm</text>
  <line x1="-200" y1="-127" x2="-163" y2="-92" stroke="#7aa7d9" stroke-width="1"/>

  <text x="0" y="40" font-size="12" fill="#8a7a2e" text-anchor="middle">diffuser ID 19.5 mm</text>
  <text x="0" y="56" font-size="10" fill="#8a7a2e" text-anchor="middle">(below part plane — optical only)</text>

  <text x="0" y="130" font-size="12" fill="#c0392b" text-anchor="middle">+1.0 mm pick tol → 29.5 mm,</text>
  <text x="0" y="146" font-size="12" fill="#c0392b" text-anchor="middle">then 0.5 mm margin to the supports</text>
  <line x1="0" y1="152" x2="0" y2="204" stroke="#c0392b" stroke-width="1"/>

  <!-- Footnote -->
  <text x="0" y="232" font-size="10" fill="#555" text-anchor="middle">roamingRadius = 30.0 (fiducial supports) − 1.0 (N24 pick tol) − 0.5 (margin) = 28.5 mm — machine.xml:953, issue #8</text>
  <text x="0" y="248" font-size="11" fill="#555" text-anchor="middle">Planned moves keep the whole part hull inside the blue circle; manual jogs are not bounded by it.</text>
  <text x="0" y="262" font-size="11" fill="#555" text-anchor="middle">Measured 2026-08-30 with calipers.</text>
</svg>
