<svg xmlns="http://www.w3.org/2000/svg" viewBox="-285 -245 570 505" font-family="system-ui, sans-serif">
  <!-- Top view of the bottom-camera area at camera Z, drawn to scale: 7 px = 1 mm. -->
  <rect x="-285" y="-245" width="570" height="505" fill="#ffffff"/>

  <!-- Build plate with 45.0 mm dia opening (evenodd hole) -->
  <path fill-rule="evenodd" fill="#d9d2c4" stroke="#a89f8d" stroke-width="1"
        d="M -285 -220 H 285 V 210 H -285 Z
           M 157.5 0 A 157.5 157.5 0 1 0 -157.5 0 A 157.5 157.5 0 1 0 157.5 0 Z"/>

  <!-- Nearest obstruction ring: fiducial supports at r = 30 mm -->
  <circle r="210" fill="none" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="3 6"/>

  <!-- Camera field of view, 46.4 x 26.0 mm -->
  <rect x="-162.4" y="-91" width="324.8" height="182" fill="#eaf2fb" fill-opacity="0.55"
        stroke="#7aa7d9" stroke-width="1.5" stroke-dasharray="8 4"/>

  <!-- Light-ring diffuser aperture, ID 19.5 mm (below the part plane) -->
  <circle r="68.25" fill="#fdf6dd" stroke="#c9b458" stroke-width="1.5"/>

  <!-- Roaming radius + N24 pick tolerance = 22.0 mm -->
  <circle r="154" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <!-- Configured roaming radius, 21.0 mm -->
  <circle r="147" fill="none" stroke="#1a5fb4" stroke-width="3"/>

  <!-- Camera axis -->
  <line x1="-8" y1="0" x2="8" y2="0" stroke="#555" stroke-width="1"/>
  <line x1="0" y1="-8" x2="0" y2="8" stroke="#555" stroke-width="1"/>

  <!-- Radius arrow for the roaming radius -->
  <line x1="0" y1="0" x2="103.9" y2="-103.9" stroke="#1a5fb4" stroke-width="1.5"/>
  <text x="46" y="-56" fill="#1a5fb4" font-size="13" font-weight="bold" transform="rotate(-45 52 -52)" text-anchor="middle">21.0 mm</text>

  <!-- Labels -->
  <text x="0" y="-228" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">Bottom-Camera Roaming Radius — Top View at Camera Z (7 px/mm)</text>

  <text x="-275" y="-198" font-size="12" fill="#6b6353">build plate (opening Ø 45.0 mm → clearance radius 22.5 mm)</text>

  <text x="152" y="-172" font-size="12" fill="#666" text-anchor="end">fiducial supports at r = 30 mm</text>
  <line x1="155" y1="-168" x2="171" y2="-121" stroke="#8a8a8a" stroke-width="1"/>

  <text x="-277" y="-131" font-size="12" fill="#4a7ab5">camera FOV 46.4 × 26.0 mm</text>
  <line x1="-200" y1="-127" x2="-163" y2="-92" stroke="#7aa7d9" stroke-width="1"/>

  <text x="0" y="40" font-size="12" fill="#8a7a2e" text-anchor="middle">diffuser ID 19.5 mm</text>
  <text x="0" y="56" font-size="10" fill="#8a7a2e" text-anchor="middle">(below part plane — optical only)</text>

  <text x="0" y="100" font-size="12" fill="#c0392b" text-anchor="middle">+1.0 mm pick tol → 22.0 mm</text>
  <line x1="0" y1="106" x2="0" y2="152" stroke="#c0392b" stroke-width="1"/>

  <text x="30" y="186" font-size="12" fill="#6b6353">0.5 mm margin to plate edge</text>
  <line x1="95" y1="176" x2="118" y2="102" stroke="#a89f8d" stroke-width="1"/>

  <!-- Footnote -->
  <text x="0" y="222" font-size="10" fill="#555" text-anchor="middle">roamingRadius = 22.5 (plate opening) − 1.0 (N24 pick tol) − 0.5 (margin) = 21.0 mm — machine.xml:953, issue #8</text>
  <text x="0" y="238" font-size="11" fill="#555" text-anchor="middle">Planned moves keep the whole part hull inside the blue circle; manual jogs are not bounded by it.</text>
  <text x="0" y="254" font-size="11" fill="#555" text-anchor="middle">Measured 2026-08-30 with calipers.</text>
</svg>
